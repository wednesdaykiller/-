<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研报核查助手</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="shell"><header><div class="brand">研报核查助手 <span>本地试运行版</span></div><p>从两份 PDF 开始，让每个核查结果都有出处。</p></header><main><section id="upload"><h1>上传财报与研报</h1><p class="muted">选择同一家公司的财务报告和研究报告。系统将提取表格指标、匹配财报依据，并汇总差异与待确认项。</p><form id="form"><div class="files"><label class="file"><b>01　财务报告</b><span>年报或半年报 PDF，作为核查依据</span><input id="annual" name="annual" type="file" accept="application/pdf,.pdf" required></label><label class="file"><b>02　研究报告</b><span>券商研报 PDF，支持原生文本与扫描件</span><input id="research" name="research" type="file" accept="application/pdf,.pdf" required></label></div><div class="model"><label><input type="checkbox" id="model"> 启用国产视觉模型辅助</label><small id="modelInfo">检查模型配置…</small></div><div class="actions"><button id="start" type="submit">开始核查</button><span class="muted">文件保存在本机；启用模型后，扫描表格图片会发送至配置的服务商。</span></div><p id="error" role="alert"></p></form></section><section id="progress" hidden><h2 id="stage">正在准备</h2><p id="detail" aria-live="polite"></p><ol id="steps"></ol></section><section id="result" hidden><div class="resultHead"><div><h2 id="company"></h2><p id="coverage" class="muted"></p></div><div><a id="download" class="button" download>下载报告</a> <a id="json" target="_blank">结果数据</a></div></div><div id="stats" class="stats"></div><p class="notice">相符仅表示已覆盖的数据通过比较。预测值、缺少依据和待确认项不计为通过；本版尚未全面核查正文陈述。</p><div class="toolbar"><label>显示 <select id="filter"><option value="all">全部结果</option><option value="attention">需要处理</option><option value="相符">相符</option><option value="预测值">预测值</option></select></label><span id="count"></span></div><div id="rows"></div></section></main><footer>财报依据自动提取 · 单位与期间归一化 · 证据定位 · 人工确认留痕</footer></div><script src="/static/app.js"></script></body></html>
