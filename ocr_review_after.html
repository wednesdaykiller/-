const risk=document.createElement('small');risk.className='risk';risk.textContent=item.flags.length?item.flags.join('\n'):'无自动风险标记，仍需人工确认';cells[3].append(risk);const action=document.createElement('select');for(const [v,t] of [['pending','待复核'],['confirm','确认'],['correct','修正'],['reject','排除']]){const opt=document.createElement('option');opt.value=v;opt.textContent=t;action.append(opt)}action.value=prior?.action??'pending';cells[3].append(action);cells[4].append(note);if(item.suggestion){const text=document.createElement('small');text.textContent='视觉核对建议：'+item.suggestion.number+' '+item.suggestion.unit+'。'+item.suggestion.note;cells[4].append(text);const use=document.createElement('button');use.textContent='填入建议（仍待复核）';use.addEventListener('click',()=>{number.value=item.suggestion.number;unit.value=item.suggestion.unit;label.value=item.suggestion.field_label;period.value=item.suggestion.period_header;note.value=item.suggestion.note;action.value='pending';refresh()});cells[4].append(use)}tbody.append(tr);entries.push({item,tr,label,period,number,unit,note,action});action.addEventListener('change',refresh);}
function refresh(){const only=document.getElementById('riskOnly').checked;let selected=0;for(const e of entries){e.tr.hidden=only&&!e.item.flags.length&&!e.item.suggestion;if(e.action.value!=='pending')selected++}document.getElementById('status').textContent='共 '+entries.length+' 个待核对数据格，已选择处理 '+selected+' 个；OCR 正文暂缓 '+data.blocked_ocr_pages.length+' 页。'}
document.getElementById('riskOnly').addEventListener('change',refresh);refresh();
document.getElementById('textFlags').textContent=data.flagged_text_records.map(r=>'第 '+r.page_num+' 页 ['+r.flags.join(', ')+'] '+r.text).join('\n\n');
document.getElementById('export').addEventListener('click',()=>{const reviewer=document.getElementById('reviewer').value.trim();if(!reviewer){alert('请填写复核人。');return}const decisions=[];for(const e of entries){const action=e.action.value;if(action==='pending')continue;const d={id:e.item.id,raw:e.item.raw,action,reviewer,note:e.note.value.trim(),reviewed_at:new Date().toISOString()};if(action!=='reject'){if(!e.number.value.trim()||!Number.isFinite(Number(e.number.value))||!e.unit.value.trim()){alert('确认或修正必须填写有限数值和明确单位。');return}Object.assign(d,{number:Number(e.number.value),unit:e.unit.value.trim(),field_label:e.label.value,period_header:e.period.value});if(action==='correct'&&!d.note){alert('修正时请填写依据。');return}if(action==='confirm'&&(d.number!==e.item.number||d.unit!==e.item.unit||d.field_label!==e.item.field_label||d.period_header!==e.item.period_header)){alert('修改过内容的条目请选择“修正”。');return}}decisions.push(d)}const blob=new Blob([JSON.stringify({extraction_sha256:data.extraction_sha256,decisions},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='review_decisions.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
</script></html>
